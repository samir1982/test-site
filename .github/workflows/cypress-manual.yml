name: Cypress Manual Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: prod
        options:
          - prod
      language:
        description: "Language to test"
        type: choice
        required: true
        default: all
        options:
          - all
          - fr
          - en
      device:
        description: "Device profile"
        type: choice
        required: true
        default: all
        options:
          - all
          - desktop
          - mobile
      tags:
        description: "Gherkin tags filter (example: @search or @search and not @wip)"
        type: string
        required: false
        default: ""
      keyword:
        description: "Optional keyword override for search.feature (example: entreprises, business)"
        type: string
        required: false
        default: ""
      email_to:
        description: "Email recipient for run results"
        type: string
        required: false
        default: "salounici@gmail.com"
      require_email:
        description: "Fail the run if email cannot be sent"
        type: choice
        required: true
        default: "true"
        options:
          - "true"
          - "false"

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Gmail defaults; secrets/variables can still override these values.
      SMTP_SERVER: ${{ secrets.SMTP_SERVER || vars.SMTP_SERVER || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT || '465' }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || vars.SMTP_USERNAME || 'salounici@gmail.com' }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || vars.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE || vars.SMTP_SECURE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cypress env arguments
        id: build_env
        shell: bash
        run: |
          ENV_ARGS="targetEnv=${{ inputs.environment }}"

          if [ "${{ inputs.language }}" != "all" ]; then
            ENV_ARGS="$ENV_ARGS,lang=${{ inputs.language }}"
          fi

          if [ "${{ inputs.device }}" != "all" ]; then
            ENV_ARGS="$ENV_ARGS,device=${{ inputs.device }}"
          fi

          if [ -n "${{ inputs.keyword }}" ]; then
            ENV_ARGS="$ENV_ARGS,keyword=${{ inputs.keyword }}"
          fi

          echo "value=$ENV_ARGS" >> "$GITHUB_OUTPUT"
          echo "Final --env: $ENV_ARGS"

      - name: Build feature scope from tags
        id: build_spec
        shell: bash
        run: |
          TAGS_INPUT="${{ inputs.tags }}"
          SPEC_PATTERN="cypress/e2e/**/*.feature"

          if [[ "$TAGS_INPUT" == *"@switch"* ]] && [[ "$TAGS_INPUT" != *"@search"* ]]; then
            SPEC_PATTERN="cypress/e2e/language-switch.feature"
          elif [[ "$TAGS_INPUT" == *"@search"* ]] && [[ "$TAGS_INPUT" != *"@switch"* ]]; then
            SPEC_PATTERN="cypress/e2e/search.feature"
          fi

          echo "value=$SPEC_PATTERN" >> "$GITHUB_OUTPUT"
          echo "Final --spec: $SPEC_PATTERN"

      - name: Run Cypress Gherkin suite
        env:
          TAGS: ${{ inputs.tags }}
        run: npx cypress run --spec "${{ steps.build_spec.outputs.value }}" --env "${{ steps.build_env.outputs.value }}"

      - name: Build run summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Cypress Manual Run Result"
            echo ""
            echo "- Status: ${{ job.status }}"
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Language: ${{ inputs.language }}"
            echo "- Device: ${{ inputs.device }}"
            echo "- Tags: ${{ inputs.tags }}"
            echo "- Keyword: ${{ inputs.keyword }}"
            echo "- Spec: ${{ steps.build_spec.outputs.value }}"
            echo "- Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > cypress-run-summary.txt

          cat cypress-run-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-run-summary
          path: cypress-run-summary.txt

      - name: Check SMTP configuration
        if: always()
        id: smtp_check
        shell: bash
        run: |
          MISSING=""
          SMTP_PORT_VALUE="${SMTP_PORT:-465}"
          FROM_VALUE="$MAIL_FROM"
          SECURE_VALUE="$SMTP_SECURE"

          if [ -z "$SMTP_SERVER" ]; then MISSING="$MISSING SMTP_SERVER"; fi
          if [ -z "$SMTP_USERNAME" ]; then MISSING="$MISSING SMTP_USERNAME"; fi
          if [ -z "$SMTP_PASSWORD" ]; then MISSING="$MISSING SMTP_PASSWORD"; fi

          # If sender is not explicitly provided, fallback to SMTP username.
          if [ -z "$FROM_VALUE" ]; then
            FROM_VALUE="$SMTP_USERNAME"
          fi

          # Auto-detect secure mode if not explicitly provided.
          # Port 465 usually requires implicit TLS (secure=true), other common ports use secure=false.
          if [ -z "$SECURE_VALUE" ]; then
            if [ "$SMTP_PORT_VALUE" = "465" ]; then
              SECURE_VALUE="true"
            else
              SECURE_VALUE="false"
            fi
          fi

          if [ -n "$MISSING" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          fi

          echo "port=$SMTP_PORT_VALUE" >> "$GITHUB_OUTPUT"
          echo "from=$FROM_VALUE" >> "$GITHUB_OUTPUT"
          echo "secure=$SECURE_VALUE" >> "$GITHUB_OUTPUT"

      - name: Send results by email
        if: always() && steps.smtp_check.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ steps.smtp_check.outputs.port }}
          secure: ${{ steps.smtp_check.outputs.secure }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[${{ github.repository }}] Cypress run ${{ job.status }}"
          to: ${{ inputs.email_to }}
          from: ${{ steps.smtp_check.outputs.from }}
          body: |
            Cypress workflow completed.

            Status: ${{ job.status }}
            Environment: ${{ inputs.environment }}
            Language: ${{ inputs.language }}
            Device: ${{ inputs.device }}
            Tags: ${{ inputs.tags }}
            Keyword: ${{ inputs.keyword }}
            Spec: ${{ steps.build_spec.outputs.value }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: cypress-run-summary.txt

      - name: Notify missing SMTP secrets
        if: always() && steps.smtp_check.outputs.ready != 'true'
        shell: bash
        run: |
          echo "SMTP secrets are missing. Email notification was skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "Missing secrets:${{ steps.smtp_check.outputs.missing }}" >> "$GITHUB_STEP_SUMMARY"
          echo "SMTP secrets are missing. Email notification was skipped."
          echo "Missing secrets:${{ steps.smtp_check.outputs.missing }}"

      - name: Fail when email is required but not configured
        if: always() && steps.smtp_check.outputs.ready != 'true' && inputs.require_email == 'true'
        shell: bash
        run: |
          echo "Email delivery is required but SMTP is not fully configured." >> "$GITHUB_STEP_SUMMARY"
          echo "Set missing secrets/vars and rerun. Missing:${{ steps.smtp_check.outputs.missing }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Email delivery is required but SMTP is not fully configured."
          echo "Set missing secrets/vars and rerun. Missing:${{ steps.smtp_check.outputs.missing }}"
          exit 1
