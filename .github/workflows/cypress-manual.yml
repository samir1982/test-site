name: Cypress CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: prod
        options:
          - prod
      language:
        description: "Language to test"
        type: choice
        required: true
        default: all
        options:
          - all
          - fr
          - en
      device:
        description: "Device profile"
        type: choice
        required: true
        default: all
        options:
          - all
          - desktop
          - mobile
      tags:
        description: "Gherkin tags filter (example: @search or @search and not @wip)"
        type: string
        required: false
        default: ""
      keyword:
        description: "Optional keyword override for search.feature (example: entreprises, business)"
        type: string
        required: false
        default: ""
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        run: echo "Deploy to staging environment"

  tests:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cypress env arguments
        id: build_env
        shell: bash
        run: |
          ENVIRONMENT="${{ inputs.environment || 'prod' }}"
          LANGUAGE="${{ inputs.language || 'all' }}"
          DEVICE="${{ inputs.device || 'all' }}"
          KEYWORD="${{ inputs.keyword || '' }}"

          ENV_ARGS="targetEnv=${ENVIRONMENT}"

          if [ "$LANGUAGE" != "all" ]; then
            ENV_ARGS="$ENV_ARGS,lang=$LANGUAGE"
          fi

          if [ "$DEVICE" != "all" ]; then
            ENV_ARGS="$ENV_ARGS,device=$DEVICE"
          fi

          if [ -n "$KEYWORD" ]; then
            ENV_ARGS="$ENV_ARGS,keyword=$KEYWORD"
          fi

          echo "value=$ENV_ARGS" >> "$GITHUB_OUTPUT"
          echo "Final --env: $ENV_ARGS"

      - name: Build feature scope from tags
        id: build_spec
        shell: bash
        run: |
          TAGS_INPUT="${{ inputs.tags || '' }}"
          SPEC_PATTERN="cypress/e2e/**/*.feature"

          if [[ "$TAGS_INPUT" == *"@switch"* ]] && [[ "$TAGS_INPUT" != *"@search"* ]]; then
            SPEC_PATTERN="cypress/e2e/language-switch.feature"
          elif [[ "$TAGS_INPUT" == *"@search"* ]] && [[ "$TAGS_INPUT" != *"@switch"* ]]; then
            SPEC_PATTERN="cypress/e2e/search.feature"
          fi

          echo "value=$SPEC_PATTERN" >> "$GITHUB_OUTPUT"
          echo "Final --spec: $SPEC_PATTERN"

      - name: Run Cypress Gherkin suite
        env:
          TAGS: ${{ inputs.tags }}
        run: npx cypress run --spec "${{ steps.build_spec.outputs.value }}" --env "${{ steps.build_env.outputs.value }}"

      - name: Build run summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Cypress CI Result"
            echo ""
            echo "- Status: ${{ job.status }}"
            echo "- Environment: ${{ inputs.environment || 'prod' }}"
            echo "- Language: ${{ inputs.language || 'all' }}"
            echo "- Device: ${{ inputs.device || 'all' }}"
            echo "- Tags: ${{ inputs.tags || '' }}"
            echo "- Keyword: ${{ inputs.keyword || '' }}"
            echo "- Spec: ${{ steps.build_spec.outputs.value }}"
            echo "- Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > cypress-run-summary.txt

          cat cypress-run-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-run-summary
          path: cypress-run-summary.txt

  validation:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Validate test result
        run: echo "Validation passed after Cypress execution"

  production:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        run: echo "Deploy to production environment"
